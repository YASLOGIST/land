<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>

  <!-- Stylized Executive Silhouette -->
  <path d="M 30 190 C 35 145, 60 135, 100 135 C 140 135, 165 145, 170 190 Z" fill="url(#suitGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <polygon points="100,148 85,135 115,135" fill="#f8fafc"/>
  <polygon points="100,165 92,138 108,138" fill="#0284c7"/>
  <rect x="88" y="110" width="24" height="28" rx="4" fill="#fed7aa"/>

  <!-- Head / Face -->
  <ellipse cx="100" cy="85" rx="34" ry="42" fill="#fed7aa"/>
  <path d="M 66 80 C 64 50, 80 40, 100 40 C 120 40, 136 50, 134 80 C 130 52, 118 46, 100 46 C 82 46, 70 52, 66 80 Z" fill="#1e293b"/>
  <path d="M 66 75 C 64 62, 72 45, 100 42 C 128 45, 136 62, 134 75 C 125 58, 115 50, 100 50 C 85 50, 75 58, 66 75 Z" fill="#0f172a"/>

  <!-- Glasses -->
  <rect x="74" y="74" width="22" height="15" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <rect x="104" y="74" width="22" height="15" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="96" y1="81" x2="104" y2="81" stroke="#38bdf8" stroke-width="2"/>
  <line x1="68" y1="78" x2="74" y2="78" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="126" y1="78" x2="132" y2="78" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Groomed Stubble -->
  <path d="M 72 88 C 74 118, 85 125, 100 125 C 115 125, 126 118, 128 88 C 124 110, 114 118, 100 118 C 86 118, 76 110, 72 88 Z" fill="#1e293b" opacity="0.65"/>
  <path d="M 90 106 Q 100 112 110 106" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Verification Badge Overlay -->
  <g transform="translate(142, 142)">
    <circle cx="16" cy="16" r="16" fill="#06b6d4" filter="url(#glow)"/>
    <path d="M 10 16 L 14 20 L 22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
